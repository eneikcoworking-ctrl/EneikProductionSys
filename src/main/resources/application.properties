falsification-cycle.cron=${FALSIFICATION_CYCLE_CRON:0 0 */4 * * ?}

# Factory-level judgment (FactoryJudgmentService). Set explicitly rather than left unregistered: this
# service's own reportValuelessBooleanFlags calls an unset flag a defect, not a default, and it is right -
# a feature that is off because nobody decided is indistinguishable from one that is off on purpose.
# Off here on purpose - and there is nothing to supply to turn it on. The judgment-sidecar runs the
# operator's already-paid Claude subscription (its own OAuth credential, mounted only there), so this flag
# is the whole of it. Every other part of the loop - cadence, cursor, retry and what becomes of the ruling
# - is the factory's.
judgment-agent.enabled=${JUDGMENT_AGENT_ENABLED:false}
judgment-agent.url=${JUDGMENT_AGENT_URL:http://judgment-sidecar:8092}
# The schedule only asks whether a refutation exists. When none does, the cycle is one indexed query - so
# this rate governs how promptly a refutation is read, not how often anything is spent.
judgment-agent.rate-ms=${JUDGMENT_AGENT_RATE_MS:900000}
judgment-agent.max-per-cycle=${JUDGMENT_AGENT_MAX_PER_CYCLE:5}

# Enabled 2026-08-03 for live verification on a fresh test project (see PersistentWorkerSessionService) -
# no other project is currently in ProjectStatus.active, so this only affects the new project's compiler/
# review-fallback sessions, not any of the frozen/accepted older ones.
orchestration.persistent-worker-sessions-enabled=${PERSISTENT_WORKER_SESSIONS_ENABLED:true}

