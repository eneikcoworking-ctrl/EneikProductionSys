server.port=${SERVER_PORT:8080}
server.shutdown=graceful
# 2026-08-14: raised from 3s. H2 runs in file mode, and MVStore only reclaims freed pages when the
# database closes cleanly - 3 seconds was never enough, so every restart killed it mid-flight (SIGKILL,
# exit 137) and the file grew forever without ever compacting. Measured result of that: 96 MB of real
# data sitting in a 1678 MB file, 94% dead pages, connection pool exhausted for 16 hours straight.
spring.lifecycle.timeout-per-shutdown-phase=30s
logging.pattern.level=%5p [%X{scope:-SYSTEM}]
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
runtime.launcher.url=${RUNTIME_LAUNCHER_URL:http://localhost:8091}

# Default Spring Boot scheduling pool size is 1 thread shared across every @Scheduled method. This app
# has 7+ competing jobs, several on a 60s cadence (ContinuousOrchestrationService, AutoMergeService,
# stuck-session detection, lease watchdog) - a single thread can stay permanently saturated by those,
# starving rarer jobs (FalsificationCycleService, every 4h) indefinitely rather than just delaying them.
# Confirmed live: zero FalsificationCycleService log output for 1h+ past its scheduled 20:00Z fire time.
spring.task.scheduling.pool.size=${SCHEDULING_POOL_SIZE:10}

# 2026-08-15 (F7): the connection pool was never configured, so it ran on Hikari's defaults - 10
# connections and leak detection DISABLED - while the line above gives the scheduler 10 threads. Ten
# schedulers competed for ten connections with the web tier, and a held connection was invisible by
# construction. Live symptom: 13 occurrences of
#   TransactionException: Unable to rollback against JDBC Connection
#   Caused by: java.sql.SQLException: Connection is closed
# in ProjectFlowService.admitDueCoverageAudits - a method whose transaction span was already correctly
# shortened on 2026-08-07, so the span was not the cause; the connection was gone before the rollback.
#
# leak-detection-threshold is the important half and changes no behaviour: it makes a connection held
# longer than the threshold print the stack trace of whoever holds it. Until now the system could not name
# the holder, which is the same defect as everywhere else tonight - a condition that exists and cannot be
# observed.
#
# The pool size is set explicitly rather than coincidentally: schedulers + web tier + headroom. It is a
# DECLARED bound, not a measured optimum - the right value needs the leak reports this setting will now
# produce.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:24}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:4}
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_MS:30000}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:20000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/eneik_db;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

