spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.repair-on-startup=false
project-factory.workspace-root=./target/project-workspaces-test
ml.service.url=http://localhost:8000
scheduling.enabled=false
# Test-only secret key for JUnit integration tests; not the production factory key
eneik.security.api-key=eneik-test-secret-key-42
