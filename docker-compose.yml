services:
  ml:
    build:
      context: ./src/models/ml
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_VERSION: ${GEMINI_API_VERSION:-v1beta}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.1-flash-lite}
      GEMINI_PRO_MODEL: ${GEMINI_PRO_MODEL:-gemini-3.1-pro-preview}
      GEMINI_PRO_FALLBACK_MODELS: ${GEMINI_PRO_FALLBACK_MODELS:-gemini-3.5-flash,gemini-3.1-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_REQUEST_TIMEOUT_SECONDS: ${GEMINI_REQUEST_TIMEOUT_SECONDS:-10}
    ports:
      - "8000:8000"
    volumes:
      - .:/project
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 2026-08-09 (Phase 1, client runtime observability plan) - the ONLY component in the whole factory
  # that holds the host docker socket. Operator's own architecture decision: contain this privilege to
  # the smallest possible, separately-reviewable surface (runtime-launcher/launcher.py, ~150 lines) -
  # never mount the socket into the much larger main backend. Not started/used until the backend's own
  # client_runtime_observability_enabled flag is turned on (stays observe_only via LeverPromotionService
  # even then) - safe to leave built and idle.
  runtime-launcher:
    build:
      context: ./runtime-launcher
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runtime-launcher-workspace:/workspace
    ports:
      - "8091:8091"
    # 2026-08-16 - this was the only one of the factory's three dependencies with no healthcheck, which is
    # why it could be down all of 2026-08-15 with nothing saying so. Probes /openapi.json rather than
    # /healthcheck: every route this service publishes is POST, and two of them (/launch, /teardown) act
    # on real containers, so a liveness probe must not use them.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/openapi.json')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        ENEIK_BUILD_GIT_SHA: ${ENEIK_BUILD_GIT_SHA:-unknown}
        ENEIK_BUILD_GIT_DIRTY: ${ENEIK_BUILD_GIT_DIRTY:-unknown}
        ENEIK_BUILD_TIME: ${ENEIK_BUILD_TIME:-unknown}
    environment:
      JAVA_OPTS: "-Xmx1024m -Xms384m -XX:+UseG1GC"
      ML_SERVICE_URL: http://ml:8000
      RUNTIME_LAUNCHER_URL: ${RUNTIME_LAUNCHER_URL:-http://runtime-launcher:8091}
      SPRING_DATASOURCE_URL: jdbc:h2:file:./data/eneik_db;DB_CLOSE_DELAY=-1
      PROJECT_FACTORY_WORKSPACE_ROOT: /app/project-workspaces
      ENEIK_OPERATOR_SYSTEM_REPO_ROOT: /app/eneik-system
      # 2026-08-14: the market corpus lives in the repository (market-corpus/), which is mounted read-only
      # at /app/eneik-system - not baked into the image. Pointing at the mount rather than copying it in
      # means a corrected corpus takes effect on restart instead of requiring a rebuild, which matters
      # because this file is meant to be edited by humans when a law or a measurement changes.
      MARKETCORPUS_ROOT: /app/eneik-system/market-corpus
      ENEIK_OPERATOR_MEMORY_ROOT: /app/data/operator-memory
      ENEIK_OPERATOR_ALLOW_MUTATING_TOOLS: ${ENEIK_OPERATOR_ALLOW_MUTATING_TOOLS:-true}
      ENEIK_OPERATOR_DOCKER_COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-eneikproductionsys}
      ENEIK_OPERATOR_MAX_TOOL_ROUNDS: ${ENEIK_OPERATOR_MAX_TOOL_ROUNDS:-3}
      ENEIK_OPERATOR_ANSWER_CRITIC_ENABLED: ${ENEIK_OPERATOR_ANSWER_CRITIC_ENABLED:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.1-flash-lite}
      GEMINI_PRO_MODEL: ${GEMINI_PRO_MODEL:-gemini-3.1-pro-preview}
      GEMINI_PRO_FALLBACK_MODELS: ${GEMINI_PRO_FALLBACK_MODELS:-gemini-3.5-flash,gemini-3.1-flash-lite}
      GOOGLE_SEARCH_GROUNDING_ENABLED: ${GOOGLE_SEARCH_GROUNDING_ENABLED:-true}
      URL_CONTEXT_ENABLED: ${URL_CONTEXT_ENABLED:-true}
      DESIGN_SERVICE_ENABLED: ${DESIGN_SERVICE_ENABLED:-true}
      DESIGN_ASSET_ROOT: /app/data/design-assets
      NANO_BANANA_ENABLED: ${NANO_BANANA_ENABLED:-true}
      NANO_BANANA_MODEL: ${NANO_BANANA_MODEL:-gemini-3.1-flash-image}
      NANO_BANANA_PRO_MODEL: ${NANO_BANANA_PRO_MODEL:-gemini-3-pro-image}
      VEO_ENABLED: ${VEO_ENABLED:-true}
      VEO_MODEL: ${VEO_MODEL:-veo-3.1-generate-preview}
      VIDEO_ASSET_ROOT: /app/data/video-assets
      STITCH_ENABLED: ${STITCH_ENABLED:-true}
      STITCH_API_KEY: ${STITCH_API_KEY:-}
      GITHUB_ENABLED: ${GITHUB_ENABLED:-true}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_ORG: ${GITHUB_ORG:-eneikcoworking-ctrl}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GITHUB_WEBHOOK_URL: ${GITHUB_WEBHOOK_URL:-}
      LINEAR_ENABLED: ${LINEAR_ENABLED:-false}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      LINEAR_TEAM_ID: ${LINEAR_TEAM_ID:-}
      LINEAR_API_URL: ${LINEAR_API_URL:-https://api.linear.app/graphql}
      JULES_MAX_CONCURRENT_SESSIONS_PER_ACCOUNT: ${JULES_MAX_CONCURRENT_SESSIONS_PER_ACCOUNT:-3}
      ORCHESTRATION_PERSISTENT_WORKER_SESSIONS_ENABLED: ${ORCHESTRATION_PERSISTENT_WORKER_SESSIONS_ENABLED:-false}
    volumes:
      - ./data:/app/data
      - ./project-workspaces:/app/project-workspaces
      - .:/app/eneik-system:ro
    ports:
      - "8080:8080"
    depends_on:
      ml:
        condition: service_healthy
    restart: unless-stopped
    # 2026-08-14: docker's default 10s grace period was killing the JVM (exit 137) before H2 could close
    # its file-mode store. MVStore only reclaims freed pages on a clean close, so every hard kill left the
    # file bigger and never compacted it - measured: 96 MB of data in a 1678 MB file. Together with the
    # raised spring.lifecycle.timeout-per-shutdown-phase this lets the store close and compact properly.
    stop_grace_period: 90s

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
