services:
  ml:
    build:
      context: ./src/models/ml
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_VERSION: ${GEMINI_API_VERSION:-v1beta}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.1-flash-lite}
      GEMINI_PRO_MODEL: ${GEMINI_PRO_MODEL:-gemini-3.1-pro-preview}
      GEMINI_PRO_FALLBACK_MODELS: ${GEMINI_PRO_FALLBACK_MODELS:-gemini-3.5-flash,gemini-3.1-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_REQUEST_TIMEOUT_SECONDS: ${GEMINI_REQUEST_TIMEOUT_SECONDS:-10}
    ports:
      - "8000:8000"
    volumes:
      - .:/project
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')"]
      interval: 10s
      timeout: 3s
      retries: 10
    # 2026-08-28. Bounded because it was not: §4.4 of the action plan added a limit to `backend` alone,
    # and four services stayed unbounded on a WSL VM capped at 3500 MB.
    # The number is derived, not guessed: PredictionService.py records the embedding model as 0.22 GB,
    # measured against its alternatives (1.0 GB for mpnet-base, 2.24 GB for e5-large), and that model is
    # loaded lazily into this process. 220 MB of weights plus onnxruntime and the Python interpreter is
    # the whole resident set; 768m leaves room for the inference arena without room for a second model.
    mem_limit: 768m
    restart: unless-stopped

  # 2026-08-09 (Phase 1, client runtime observability plan) - the ONLY component in the whole factory
  # that holds the host docker socket. Operator's own architecture decision: contain this privilege to
  # the smallest possible, separately-reviewable surface (runtime-launcher/launcher.py, ~150 lines) -
  # never mount the socket into the much larger main backend. Not started/used until the backend's own
  # client_runtime_observability_enabled flag is turned on (stays observe_only via LeverPromotionService
  # even then) - safe to leave built and idle.
  runtime-launcher:
    build:
      context: ./runtime-launcher
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runtime-launcher-workspace:/workspace
    ports:
      - "8091:8091"
    # 2026-08-16 - this was the only one of the factory's three dependencies with no healthcheck, which is
    # why it could be down all of 2026-08-15 with nothing saying so. Probes /openapi.json rather than
    # /healthcheck: every route this service publishes is POST, and two of them (/launch, /teardown) act
    # on real containers, so a liveness probe must not use them.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/openapi.json')"]
      interval: 10s
      timeout: 3s
      retries: 10
    # 2026-08-28. This limit binds the launcher process and NOTHING IT STARTS. The service runs
    # `docker compose up --build -d` against a client repository through the host socket, so the client's
    # containers and BuildKit are siblings on the same daemon, outside every cgroup in this file. That is
    # the one unbounded path left in the factory, and no value here closes it - only the
    # client_runtime_observability_enabled flag does. 256m covers Python, FastAPI and the docker CLI.
    mem_limit: 256m
    # 2026-08-30 (plan §4.44): the bound the launcher applies to EACH service of the product it starts.
    # The limit above binds only the launcher process; without this one the product's containers and
    # BuildKit run outside every cgroup in this file, which is why this service was kept down - and while
    # it is down nothing serves the product and the consumer sees Cloudflare 530/1033. Declared here,
    # beside every other limit in this factory, rather than chosen inside the launcher.
    environment:
      CLIENT_STACK_MEM_LIMIT: ${CLIENT_STACK_MEM_LIMIT:-384m}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 2026-08-28: Primary Autonomous Judgment Service (Gemini REST API + Shadow Arbiter Fallback).
  # Claude sidecar permanently decommissioned as Muda to free WSL2 RAM and eliminate weekly limit lockouts.
  judgment-proxy:
    build:
      context: ./judgment-proxy
    environment:
      JUDGMENT_SHADOW_DIR: /shadow
      JUDGMENT_PROXY_WAIT_MS: ${JUDGMENT_PROXY_WAIT_MS:-240000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-2.5-flash-lite,gemini-1.5-flash}
    volumes:
      - ./data/judgment-shadow:/shadow
    ports:
      - "8093:8093"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8093/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
    # 2026-08-28. A Node HTTP proxy that forwards to the Gemini REST API and writes shadow files: it holds
    # one request body at a time and no model. 256m is the default Node heap's own neighbourhood.
    mem_limit: 256m
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        ENEIK_BUILD_GIT_SHA: ${ENEIK_BUILD_GIT_SHA:-unknown}
        ENEIK_BUILD_GIT_DIRTY: ${ENEIK_BUILD_GIT_DIRTY:-unknown}
        ENEIK_BUILD_TIME: ${ENEIK_BUILD_TIME:-unknown}
    environment:
      # Heap is DERIVED from the container limit, never stated independently (2026-08-28). Two numbers
      # for one quantity is how they drift: Dockerfile.backend said -Xmx1536m while this file said
      # -Xmx1024m, and which one won could only be learned by experiment. MaxRAMPercentage reads the
      # cgroup limit set by mem_limit below, so there is exactly one number to change. That claim was
      # false until 2026-08-28: Dockerfile.backend still carried its own -Xmx1536m, invisible only
      # because this file replaces JAVA_OPTS wholesale. It has been removed there rather than
      # overridden here.
      #
      # -Xmx bounds the HEAP only. Real RSS is heap + metaspace + code cache + thread stacks + direct
      # buffers + GC structures; for this app (49 JPA repositories, a 24-connection Hikari pool, an H2
      # page cache) the non-heap part is several hundred MB. That is why an -Xmx of 1024m produced a
      # process the host could not afford, and why the bound that matters is mem_limit, not -Xmx.
      JAVA_OPTS: "-XX:MaxRAMPercentage=55 -XX:MaxMetaspaceSize=192m -XX:+UseG1GC"
      ML_SERVICE_URL: http://ml:8000
      RUNTIME_LAUNCHER_URL: ${RUNTIME_LAUNCHER_URL:-http://runtime-launcher:8091}
      JUDGMENT_AGENT_URL: ${JUDGMENT_AGENT_URL:-http://judgment-proxy:8093}
      # H2 anti-bloat (2026-08-27, ENGINEERING_PHILOSOPHY_ACTION_PLAN.md Phase 4). This value, not
      # application.properties, is what the backend actually runs with - the env var overrides the
      # property default, so editing only the properties file changes nothing.
      # /app/data is the same file as ./data/eneik_db: WORKDIR is /app and ./data is bind-mounted there.
      # DB_CLOSE_ON_EXIT is deliberately FALSE. With TRUE, H2 registers its own JVM shutdown
      # hook that races Spring's, and it kept winning: every shutdown logged "The database has
      # been closed" from EneikProductionApplication.compactH2StoreOnShutdown, so SHUTDOWN
      # COMPACT never ran once and the store was only ever compacted by hand. Leaving the close
      # to Spring alone lets the @PreDestroy hook find the database open.
      SPRING_DATASOURCE_URL: jdbc:h2:file:/var/lib/eneik/eneik_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DEFRAG_ALWAYS=TRUE;AUTO_COMPACT_FILL_RATE=80
      PROJECT_FACTORY_WORKSPACE_ROOT: /app/project-workspaces
      # 2026-08-28, §5b item 5. Hikari was 24 connections against an EMBEDDED H2 - a library in this same
      # JVM, not a server. Connections buy no parallelism there; what they buy is 24 transactions able to
      # hold their result sets in the heap at once, inside a cgroup of 1 GB whose heap is 55% of that.
      # 12 is derived rather than picked: the scheduler pool is 10 threads
      # (spring.task.scheduling.pool.size), every periodic reader runs on one of them, and the remaining 2
      # cover the dashboard's own requests, which arrive from a single operator browser. If a scheduled
      # task ever blocks waiting for a connection it will say so in the Hikari log, and that log entry is
      # the measurement this number should be corrected by.
      DB_POOL_SIZE: 12
      ENEIK_OPERATOR_SYSTEM_REPO_ROOT: /app/eneik-system
      # 2026-08-14: the market corpus lives in the repository (market-corpus/), which is mounted read-only
      # at /app/eneik-system - not baked into the image. Pointing at the mount rather than copying it in
      # means a corrected corpus takes effect on restart instead of requiring a rebuild, which matters
      # because this file is meant to be edited by humans when a law or a measurement changes.
      MARKETCORPUS_ROOT: /app/eneik-system/market-corpus
      ENEIK_OPERATOR_MEMORY_ROOT: /app/data/operator-memory
      ENEIK_OPERATOR_ALLOW_MUTATING_TOOLS: ${ENEIK_OPERATOR_ALLOW_MUTATING_TOOLS:-true}
      ENEIK_OPERATOR_DOCKER_COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-eneikproductionsys}
      ENEIK_OPERATOR_MAX_TOOL_ROUNDS: ${ENEIK_OPERATOR_MAX_TOOL_ROUNDS:-3}
      ENEIK_OPERATOR_ANSWER_CRITIC_ENABLED: ${ENEIK_OPERATOR_ANSWER_CRITIC_ENABLED:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.1-flash-lite}
      GEMINI_PRO_MODEL: ${GEMINI_PRO_MODEL:-gemini-3.1-pro-preview}
      GEMINI_PRO_FALLBACK_MODELS: ${GEMINI_PRO_FALLBACK_MODELS:-gemini-3.5-flash,gemini-3.1-flash-lite}
      GOOGLE_SEARCH_GROUNDING_ENABLED: ${GOOGLE_SEARCH_GROUNDING_ENABLED:-true}
      URL_CONTEXT_ENABLED: ${URL_CONTEXT_ENABLED:-true}
      DESIGN_SERVICE_ENABLED: ${DESIGN_SERVICE_ENABLED:-true}
      DESIGN_ASSET_ROOT: /app/data/design-assets
      NANO_BANANA_ENABLED: ${NANO_BANANA_ENABLED:-true}
      NANO_BANANA_MODEL: ${NANO_BANANA_MODEL:-gemini-3.1-flash-image}
      NANO_BANANA_PRO_MODEL: ${NANO_BANANA_PRO_MODEL:-gemini-3-pro-image}
      VEO_ENABLED: ${VEO_ENABLED:-true}
      VEO_MODEL: ${VEO_MODEL:-veo-3.1-generate-preview}
      VIDEO_ASSET_ROOT: /app/data/video-assets
      STITCH_ENABLED: ${STITCH_ENABLED:-true}
      STITCH_API_KEY: ${STITCH_API_KEY:-}
      GITHUB_ENABLED: ${GITHUB_ENABLED:-true}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # 2026-08-28: the factory now works eneikdru/test-fiftieth. GITHUB_ORG is what
      # ProjectFlowService.createProject stamps into repositoryUrl, and GitHubPullRequestService.repoRef
      # only falls back to it when a project has no repositoryUrl of its own - so this decides the owner
      # of every NEW project, and nothing else.
      GITHUB_ORG: ${GITHUB_ORG:-eneikdru}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GITHUB_WEBHOOK_URL: ${GITHUB_WEBHOOK_URL:-}
      LINEAR_ENABLED: ${LINEAR_ENABLED:-false}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      LINEAR_TEAM_ID: ${LINEAR_TEAM_ID:-}
      LINEAR_API_URL: ${LINEAR_API_URL:-https://api.linear.app/graphql}
      JULES_MAX_CONCURRENT_SESSIONS_PER_ACCOUNT: ${JULES_MAX_CONCURRENT_SESSIONS_PER_ACCOUNT:-3}
      ORCHESTRATION_PERSISTENT_WORKER_SESSIONS_ENABLED: ${ORCHESTRATION_PERSISTENT_WORKER_SESSIONS_ENABLED:-false}
    volumes:
      # The LIVE H2 store lives on a Docker-managed volume, not on the Windows bind mount
      # (2026-08-28). Measured across this host all day: every operation performed inside a
      # container filesystem succeeded, and every one that crossed ./data failed - `read 0` on
      # reads, `Writing to FileChannel failed` on writes (16 in three minutes), torn copies of a
      # live file, and stale file locks left by killed containers. A database whose writes can
      # silently fail is a database that will eventually be corrupt, and this one was nearly lost
      # once already. ./data stays mounted for everything else the factory keeps there
      # (design-assets, logs, judgment-shadow, operator-memory, backups) - those tolerate a
      # transient failure; the write-ahead store does not.
      - eneik-db:/var/lib/eneik
      - ./data:/app/data
      - ./project-workspaces:/app/project-workspaces
      - .:/app/eneik-system:ro
    # Without this, MaxRAMPercentage above reads the HOST's memory and sizes the heap at 55% of 3.3 GB -
    # worse than the absolute -Xmx it replaced. The two settings only make sense together.
    # Declared, not measured: 1g is chosen from three crude free-memory deltas taken this session
    # (backend idle ~720-840 MB) plus headroom, not from `docker stats` under load. It bounds the worst
    # case rather than reserving; adjust it from a real peak, and treat this number as provisional.
    mem_limit: 1g
    ports:
      - "8080:8080"
    depends_on:
      ml:
        condition: service_healthy
      judgment-proxy:
        condition: service_healthy
    restart: unless-stopped
    # 2026-08-14: docker's default 10s grace period was killing the JVM (exit 137) before H2 could close
    # its file-mode store. MVStore only reclaims freed pages on a clean close, so every hard kill left the
    # file bigger and never compacted it - measured: 96 MB of data in a 1678 MB file. Together with the
    # raised spring.lifecycle.timeout-per-shutdown-phase this lets the store close and compact properly.
    stop_grace_period: 90s

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    # 2026-08-28. nginx:alpine serving a directory of static files built at image time - no Node at
    # runtime. 128m is generous for it and is here so that "every service is bounded" is checkable by
    # reading the file rather than remembered.
    mem_limit: 128m
    restart: unless-stopped

volumes:
  # Docker-managed, so the H2 store never crosses the Windows file-sharing layer.
  # Back it up with:
  #   docker compose run --rm -v eneikproductionsys_eneik-db:/db -v "$PWD/data:/out" backend \
  #     sh -c 'cp /db/eneik_db.mv.db /out/eneik_db.backup.mv.db'
  eneik-db:
